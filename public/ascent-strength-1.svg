<svg width="160" height="160" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <!-- Left laurel - thicker and bolder -->
  <g transform="translate(12, 25)">
    <!-- Leaves -->
    <ellipse cx="2" cy="2" rx="2.5" ry="4" fill="#f59e0b" transform="rotate(-25 2 2)"/>
    <ellipse cx="3" cy="8" rx="2.5" ry="4" fill="#f59e0b" transform="rotate(-15 3 8)"/>
    <ellipse cx="4" cy="14" rx="2.5" ry="4" fill="#f59e0b" transform="rotate(-5 4 14)"/>
    <ellipse cx="5" cy="20" rx="2.5" ry="4" fill="#f59e0b" transform="rotate(5 5 20)"/>
    <ellipse cx="6" cy="26" rx="2.5" ry="4" fill="#f59e0b" transform="rotate(15 6 26)"/>
    <!-- Stem -->
    <line x1="0" y1="0" x2="7" y2="28" stroke="#f59e0b" stroke-width="1.5"/>
  </g>

  <!-- Right laurel - thicker and bolder -->
  <g transform="translate(146, 25)">
    <!-- Leaves -->
    <ellipse cx="-2" cy="2" rx="2.5" ry="4" fill="#f59e0b" transform="rotate(25 -2 2)"/>
    <ellipse cx="-3" cy="8" rx="2.5" ry="4" fill="#f59e0b" transform="rotate(15 -3 8)"/>
    <ellipse cx="-4" cy="14" rx="2.5" ry="4" fill="#f59e0b" transform="rotate(5 -4 14)"/>
    <ellipse cx="-5" cy="20" rx="2.5" ry="4" fill="#f59e0b" transform="rotate(-5 -5 20)"/>
    <ellipse cx="-6" cy="26" rx="2.5" ry="4" fill="#f59e0b" transform="rotate(-15 -6 26)"/>
    <!-- Stem -->
    <line x1="0" y1="0" x2="-7" y2="28" stroke="#f59e0b" stroke-width="1.5"/>
  </g>

  <!-- Main text - large -->
  <text x="80" y="85" font-size="50" font-weight="bold" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif">20年</text>

  <!-- Subtitle text below number -->
  <text x="80" y="105" font-size="11" font-weight="bold" text-anchor="middle" fill="#1f2937" font-family="Arial, sans-serif">の実績</text>

  <!-- Main heading - top -->
  <text x="80" y="40" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f2937" font-family="Arial, sans-serif">マーケティング</text>

  <!-- Bottom text -->
  <text x="80" y="138" font-size="9" text-anchor="middle" fill="#6b7280" font-family="Arial, sans-serif">専門性</text>
</svg>
